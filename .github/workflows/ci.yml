name: QAOA tests and security checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      AUDIT_SECRET_KEY: "test-only-ci-audit-secret-not-for-production-2026"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Compile Python sources
        run: python -m compileall -q agents qaoa_optimizer cli.py enrichment.py
      - name: Run Python test suite
        run: python -m pytest -q
      - name: Test browser simulator
        run: node --test tests/test_web_qaoa.mjs
      - name: Check audit integrity
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
