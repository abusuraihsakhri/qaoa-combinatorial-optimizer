[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-combinatorial-optimizer"
version = "2.0.0"
description = "QAOA Quantum Approximate Optimization Algorithm Max-Cut Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.28,<1"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["agents*", "qaoa_optimizer*"]

[project.scripts]
qaoa-combinatorial-optimizer = "qaoa_optimizer.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/qaoa-combinatorial-optimizer"
Repository = "https://github.com/abusuraihsakhri/qaoa-combinatorial-optimizer.git"
