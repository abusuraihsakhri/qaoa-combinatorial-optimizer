[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qaoa-combinatorial-optimizer"
version = "2.0.0"
description = "QAOA Quantum Approximate Optimization Algorithm Max-Cut Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
qaoa-combinatorial-optimizer = "qaoa_optimizer.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/qaoa-combinatorial-optimizer"
Repository = "https://github.com/abusuraihsakhri/qaoa-combinatorial-optimizer.git"
